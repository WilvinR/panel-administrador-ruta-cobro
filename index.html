<style>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,getDocs,getDoc,setDoc,updateDoc,deleteDoc,doc,runTransaction,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBIUEHtcuhPv3EmohKJtZ2FXsm6OsNQscY",authDomain:"rutacobrord.firebaseapp.com",projectId:"rutacobrord",storageBucket:"rutacobrord.firebasestorage.app",messagingSenderId:"626570456246",appId:"1:626570456246:web:6931e4e3f320c15e378a17"});
const auth=getAuth(app),fs=getFirestore(app),ADMIN="danielquezada905@gmail.com",D=864e5;
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,"0"),rd=n=>"RD$"+(+n||0).toLocaleString("es-DO");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fd=t=>{const d=new Date(t);return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear()},ms=v=>v&&v.toMillis?v.toMillis():(v||0);
const openModal=h=>{$("#md").innerHTML=h;$("#ov").classList.add("on")},closeModal=()=>$("#ov").classList.remove("on");
const toast=m=>{const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)};
document.addEventListener("click",e=>{if(e.target.closest("[data-close]")||e.target.id==="ov")closeModal()});
let U=[],P=[],M=[],PN={},C={},tab="s",q="",fu="";
async function load(){const[a,b,c,m,pn]=await Promise.all([getDocs(collection(fs,"users")),getDocs(collection(fs,"pagos")),getDoc(doc(fs,"config","app")),getDocs(collection(fs,"mensajes")),getDocs(collection(fs,"pendientes"))]);
 PN={};pn.docs.forEach(d=>{const x=d.data();PN[d.id]={...x,sentAt:ms(x.sentAt)}});
 M=m.docs.map(d=>{const x=d.data();return{id:d.id,...x,createdAt:ms(x.createdAt),repliedAt:ms(x.repliedAt)}}).sort((a,b)=>b.createdAt-a.createdAt);
 U=a.docs.map(d=>{const x=d.data();return{id:d.id,...x,createdAt:ms(x.createdAt),paidUntil:ms(x.paidUntil),exemptUntil:ms(x.exemptUntil)}});
 P=b.docs.map(d=>{const x=d.data();return{id:d.id,...x,date:ms(x.date),until:ms(x.until)}}).sort((a,b)=>b.date-a.date);C=c.exists()?c.data():{}}
function st(u){const n=Date.now(),dl=x=>Math.max(1,Math.ceil((x-n)/D)),t=u.createdAt+15*D,p=u.paidUntil;
 if(u.blocked)return{k:"blk",l:"Desactivado",c:"er"};
 if(u.exempt)return{k:"ex",l:"Exonerado",c:"ok"};
 if(u.exemptUntil&&n<u.exemptUntil)return{k:"ex",l:"Exonerado hasta "+fd(u.exemptUntil),c:"ok"};
 if(n<p)return{k:"pd",l:"Activo hasta "+fd(p),c:"ok",d:dl(p)};
 if(n<t)return{k:"tr",l:"Prueba · "+dl(t)+" d",c:"in",d:dl(t)};
 if(p&&n<p+5*D)return{k:"gr",l:"En gracia · "+dl(p+5*D)+" d",c:"wn",d:dl(p+5*D)};
 return{k:"ve",l:"Vencido",c:"er"}}
function price(u,k){const m=+C.priceMonthly||500,y=+C.priceYearly||4800,v=+u.discValue||0,b=k==="m"?m:y;
 if(u.discType==="pct"&&v>0)return Math.round(b*(1-v/100));if(u.discType==="fix"&&v>0)return Math.round(b*v/m);return b}
function login(msg){$("#app").innerHTML=`<div class="ctr"><h1>RutaCobro · Admin</h1><p class="mt">Acceso solo para el administrador</p><div class="ac" style="justify-content:center"><button class="btn" id="gl">Entrar con Google</button></div>${msg?`<p style="color:var(--er);margin-top:12px">${esc(msg)}</p>`:""}</div>`;
 $("#gl").onclick=()=>{const p=new GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});signInWithPopup(auth,p).catch(e=>{if(e.code==="auth/popup-blocked")signInWithRedirect(auth,p);else if(e.code!=="auth/popup-closed-by-user")login("No se pudo iniciar sesión ("+e.code+")")})}}
function render(){const a=$("#app"),nw=M.filter(x=>x.status==="nuevo").length;
 a.innerHTML=`<div class="hd"><b>RutaCobro · Admin</b><button class="btn g s" id="so">Salir</button></div><div class="tabs">${[["s","Suscriptores"],["m","Mensajes"],["p","Pagos"],["a","Ajustes"]].map(([k,l])=>`<button data-t="${k}" class="${tab===k?"on":""}">${l}${k==="m"&&nw?` <span class="tg er">${nw}</span>`:""}</button>`).join("")}</div>${tab==="s"?vS():tab==="m"?vM():tab==="p"?vP():vA()}`;
 $("#so").onclick=()=>signOut(auth);
 a.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
 a.querySelectorAll("[data-fu]").forEach(b=>b.onclick=()=>{fu=b.dataset.fu;render()});
 const i=$("#q");if(i)i.oninput=e=>{q=e.target.value;const p=e.target.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(p,p)};
 a.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>userModal(b.dataset.u));
 a.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>msgModal(b.dataset.m));
 const g=$("#sv");if(g)g.onclick=saveCfg}
const dk=t=>{const d=new Date(t);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
function uso(u){const s=u.stats||{},n=Date.now(),lim=dk(n-29*D),c=+s.c||0,l=+s.l||0,m=+s.m||0;let nc=0,nl=0;
 Object.entries(s.d||{}).forEach(([k,v])=>{if(k>=lim&&Array.isArray(v)){nc+=+v[0]||0;nl+=+v[1]||0}});
 const k=!c&&!l?"sn":(nc||nl)?"cr":(m&&n-m<=30*D)?"ac":"es";
 return{c,l,nc,nl,m,k,t:{sn:["Sin uso","er"],cr:["Creciendo","ok"],ac:["Activo","in"],es:["Estancado","wn"]}[k]}}
const row=x=>{const o=uso(x.u);return`<div class="it" data-u="${x.u.id}"><div class="grow"><div class="nm">${esc(x.u.name)}</div><div class="mt">${esc(x.u.code)} · ${esc(x.u.email)}</div><div class="mt">${o.c} clientes${o.nc?` (+${o.nc})`:""} · ${o.l} préstamos${o.nl?` (+${o.nl})`:""} · Mov: ${o.m?fd(o.m):"—"}</div></div><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end"><span class="tg ${x.s.c}">${x.s.l}</span><span class="tg ${o.t[1]}">${o.t[0]}</span></div></div>`};
function vS(){const L=U.map(u=>({u,s:st(u)})),cnt=k=>L.filter(x=>k.includes(x.s.k)).length,
 soon=L.filter(x=>(["pd","gr"].includes(x.s.k)&&x.s.d<=7)||(x.s.k==="tr"&&x.s.d<=3)),
 s=q.trim().toLowerCase(),f=L.filter(x=>!s||[x.u.name,x.u.email,x.u.code].join(" ").toLowerCase().includes(s)).filter(x=>!fu||uso(x.u).k===fu).sort((a,b)=>b.u.createdAt-a.u.createdAt);
 const pend=L.filter(x=>PN[x.u.id]),prow=x=>{const p=PN[x.u.id];return`<div class="it" data-u="${x.u.id}"><div class="grow"><div class="nm">${esc(x.u.name)}</div><div class="mt">${esc(x.u.code)} · ${p.plan==="m"?"Mensual":"Anual"} · ${rd(p.amount)} · ${fd(p.sentAt)}</div></div><span class="tg wn">Por confirmar</span></div>`};
 return`${pend.length?`<div class="card" style="border-color:var(--wn)"><b>Comprobantes por confirmar (${pend.length})</b>${pend.map(prow).join("")}</div>`:""}<div class="stats"><div><b>${U.length}</b>Registrados</div><div><b>${cnt(["pd","ex"])}</b>Activos</div><div><b>${cnt(["tr"])}</b>En prueba</div><div><b>${cnt(["ve","gr","blk"])}</b>Vencidos</div></div><div class="ac" style="margin:0 0 10px">${[["","Todos"],["cr","Creciendo"],["ac","Activo"],["es","Estancado"],["sn","Sin uso"]].map(([k,l])=>`<button class="btn ${fu===k?"":"g"} s" data-fu="${k}">${l}${k?" "+L.filter(y=>uso(y.u).k===k).length:""}</button>`).join("")}</div>${soon.length?`<div class="card al"><b>Vencen pronto (${soon.length})</b>${soon.map(row).join("")}</div>`:""}<input id="q" placeholder="Buscar por código, nombre o correo" value="${esc(q)}">${f.map(row).join("")||'<p class="mt">Sin resultados</p>'}`}
function vP(){const m=new Date(),tot=P.filter(p=>{const d=new Date(p.date);return d.getMonth()===m.getMonth()&&d.getFullYear()===m.getFullYear()}).reduce((a,p)=>a+(+p.amount||0),0);
 return`<div class="card"><div class="mt">Ingresos de este mes</div><h1 style="margin:0">${rd(tot)}</h1></div>${P.map(p=>`<div class="it" style="cursor:default"><div class="grow"><div class="nm">#${String(p.receipt).padStart(4,"0")} · ${esc(p.name)}</div><div class="mt">${esc(p.code)} · ${p.plan==="m"?"Mensual":"Anual"} · ${fd(p.date)}${p.note?" · "+esc(p.note):""}</div></div><b>${rd(p.amount)}</b></div>`).join("")||'<p class="mt">Aún no hay pagos</p>'}`}
function vA(){const b=C.bank||{},f=(id,l,v,t)=>`<label>${l}</label><input id="${id}" ${t||""} value="${esc(v??"")}">`;
 return`<div class="card"><h2 style="margin-bottom:8px">Datos de pago</h2>${f("cb","Banco",b.name)}${f("ch","Titular",b.holder)}${f("ct","Tipo de cuenta",b.type)}${f("cn","Número de cuenta",b.number)}${f("cw","WhatsApp (con código de país, ej. 18095550000)",C.whatsapp,'inputmode="tel"')}</div><div class="card"><h2 style="margin-bottom:8px">Precios (RD$)</h2>${f("pm","Mensual",C.priceMonthly??500,'type="number" inputmode="numeric"')}${f("py","Anual",C.priceYearly??4800,'type="number" inputmode="numeric"')}</div><button class="btn" id="sv" style="width:100%">Guardar ajustes</button>`}
async function saveCfg(){try{await setDoc(doc(fs,"config","app"),{bank:{name:$("#cb").value.trim(),holder:$("#ch").value.trim(),type:$("#ct").value.trim(),number:$("#cn").value.trim()},whatsapp:$("#cw").value.replace(/\D/g,""),priceMonthly:+$("#pm").value||500,priceYearly:+$("#py").value||4800},{merge:true});await load();render();toast("Ajustes guardados")}catch(e){toast("Error: "+(e.code||e.message))}}
async function upd(id,data){try{await updateDoc(doc(fs,"users",id),data);await load();closeModal();render();toast("Guardado")}catch(e){toast("Error: "+(e.code||e.message))}}
function userModal(id){const u=U.find(x=>x.id===id),s=st(u);
 openModal(`<h2>${esc(u.name)}</h2><p class="mt">${esc(u.code)} · ${esc(u.email)}</p><p style="margin-top:8px">${s.l}</p>${(o=>`<p style="margin-top:8px"><span class="tg ${o.t[1]}">${o.t[0]}</span></p><p class="mt" style="margin-top:6px">Clientes: ${o.c}${o.nc?` (+${o.nc} en 30 días)`:""} · Préstamos activos: ${o.l}${o.nl?` (+${o.nl} en 30 días)`:""} · Último movimiento: ${o.m?fd(o.m):"sin datos"}</p>`)(uso(u))}${PN[id]?`<p style="margin-top:8px;color:var(--wn)">Envió comprobante: plan ${PN[id].plan==="m"?"mensual":"anual"}, ${rd(PN[id].amount)}</p>`:""}<p class="mt">Precio: mensual ${rd(price(u,"m"))} · anual ${rd(price(u,"y"))}${u.discType?" · descuento "+(u.discType==="pct"?u.discValue+"%":"precio fijo "+rd(u.discValue)):""}</p><div class="ac"><button class="btn" id="a1">+1 mes</button><button class="btn" id="a2">+1 año</button><button class="btn g" id="ex">Exonerar</button><button class="btn g" id="ds">Descuento</button>${PN[id]?'<button class="btn g" id="qp">Quitar aviso de pago</button>':""}<button class="btn g" id="bl">${u.blocked?"Activar":"Desactivar"}</button><button class="btn g" data-close>Cerrar</button></div>`);
 $("#a1").onclick=()=>payModal(id,"m");$("#a2").onclick=()=>payModal(id,"y");$("#ex").onclick=()=>exModal(id);$("#ds").onclick=()=>dsModal(id);
 const qp=$("#qp");if(qp)qp.onclick=async()=>{try{await deleteDoc(doc(fs,"pendientes",id));await load();closeModal();render();toast("Aviso quitado")}catch(e){toast("Error: "+(e.code||e.message))}};
 $("#bl").onclick=()=>upd(id,{blocked:!u.blocked})}
function payModal(id,k){const u=U.find(x=>x.id===id),list=k==="m"?(+C.priceMonthly||500):(+C.priceYearly||4800),pr=price(u,k);
 openModal(`<h2>Confirmar pago</h2><p class="mt">${esc(u.name)} · ${esc(u.code)} · plan ${k==="m"?"mensual":"anual"}</p><label>Monto recibido (RD$)</label><input id="am" type="number" inputmode="decimal" value="${pr}"><label>Nota (opcional)</label><input id="nt"><div class="ac"><button class="btn g" data-close>Cancelar</button><button class="btn" id="ok">Confirmar y activar</button></div>`);
 $("#ok").onclick=async()=>{const amt=+$("#am").value,note=$("#nt").value.trim();if(!(amt>=0)||$("#am").value==="")return toast("Monto inválido");$("#ok").disabled=true;
  try{const n=Date.now(),until=Math.max(n,u.paidUntil||0,u.createdAt+15*D)+(k==="m"?30:365)*D;
   const no=await runTransaction(fs,async tx=>{const cr=doc(fs,"config","app"),c=await tx.get(cr),r=(c.exists()&&c.data().nextReceipt)||1;
    tx.set(cr,{nextReceipt:r+1},{merge:true});tx.update(doc(fs,"users",id),{paidUntil:new Date(until),blocked:false});tx.delete(doc(fs,"pendientes",id));
    tx.set(doc(collection(fs,"pagos")),{uid:id,code:u.code,name:u.name,email:u.email,plan:k,price:list,amount:amt,note,receipt:r,until:new Date(until),date:serverTimestamp()});return r});
   await load();render();receipt(k,list,amt,until,no)}catch(e){toast("Error: "+(e.code||e.message));$("#ok").disabled=false}}}
function receipt(k,list,amt,until,no){const dis=list-amt,txt=`✅ Pago confirmado\nMembresía RutaCobro · plan ${k==="m"?"mensual":"anual"}\nPrecio: ${rd(list)}\n${dis>0?"Descuento: "+rd(dis)+"\n":""}Total pagado: ${rd(amt)}\nVálido hasta: ${fd(until)}\nRecibo #${String(no).padStart(4,"0")}`;
 openModal(`<h2>Pago registrado</h2><pre class="rc">${esc(txt)}</pre><div class="ac"><button class="btn g" id="cp">Copiar</button><a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(txt)}">Enviar por WhatsApp</a><button class="btn g" data-close>Cerrar</button></div>`);
 $("#cp").onclick=()=>navigator.clipboard.writeText(txt).then(()=>toast("Copiado"))}
function exModal(id){const u=U.find(x=>x.id===id);
 openModal(`<h2>Exonerar a ${esc(u.name)}</h2><label>Hasta (vacío = permanente)</label><input id="eu" type="date"><label>Motivo</label><input id="em" value="${esc(u.exemptNote||"")}"><div class="ac"><button class="btn g" data-close>Cancelar</button><button class="btn g" id="eq">Quitar exoneración</button><button class="btn" id="eg">Exonerar</button></div>`);
 $("#eg").onclick=()=>{const v=$("#eu").value,nt=$("#em").value.trim();upd(id,v?{exempt:false,exemptUntil:new Date(v+"T23:59:59"),exemptNote:nt}:{exempt:true,exemptUntil:null,exemptNote:nt})};
 $("#eq").onclick=()=>upd(id,{exempt:false,exemptUntil:null})}
function dsModal(id){const u=U.find(x=>x.id===id);
 openModal(`<h2>Descuento para ${esc(u.name)}</h2><label>Tipo</label><select id="dt"><option value="">Sin descuento</option><option value="pct" ${u.discType==="pct"?"selected":""}>Porcentaje (%)</option><option value="fix" ${u.discType==="fix"?"selected":""}>Precio mensual fijo (RD$)</option></select><label>Valor</label><input id="dv" type="number" inputmode="decimal" value="${u.discValue||""}"><div class="ac"><button class="btn g" data-close>Cancelar</button><button class="btn" id="dg">Guardar</button></div>`);
 $("#dg").onclick=()=>{const t=$("#dt").value,v=+$("#dv").value;if(t&&!(v>0))return toast("Pon un valor");if(t==="pct"&&v>100)return toast("Máximo 100%");upd(id,t?{discType:t,discValue:v}:{discType:null,discValue:0})}}
const SL={nuevo:["Nuevo","er"],leido:["Leído","wn"],resuelto:["Resuelto","ok"]};
function vM(){return M.map(m=>`<div class="it" data-m="${m.id}"><div class="grow"><div class="nm">${esc(m.name)} <span class="mt">${esc(m.code)}</span></div><div class="mt">${esc(String(m.text).slice(0,90))}${m.text.length>90?"…":""}</div><div class="mt">${fd(m.createdAt)}${m.reply?" · respondido":""}</div></div><span class="tg ${(SL[m.status]||SL.nuevo)[1]}">${(SL[m.status]||SL.nuevo)[0]}</span></div>`).join("")||'<p class="mt">No hay mensajes</p>'}
async function mupd(id,data,msg){try{await updateDoc(doc(fs,"mensajes",id),data);await load();render();return true}catch(e){toast("Error: "+(e.code||e.message));return false}}
async function msgModal(id){const m=M.find(x=>x.id===id);if(!m)return;
 if(m.status==="nuevo"){await mupd(id,{status:"leido"});}
 const x=M.find(y=>y.id===id);
 openModal(`<h2>${esc(x.name)}</h2><p class="mt">${esc(x.code)} · ${esc(x.email)} · ${fd(x.createdAt)}</p><div class="rc">${esc(x.text)}</div><label style="margin-top:10px;display:block">Tu respuesta (la ve en su app)</label><textarea id="rp">${esc(x.reply||"")}</textarea><div class="ac"><button class="btn g" data-close>Cerrar</button><button class="btn" id="rs">Enviar respuesta</button><button class="btn g" id="rv">${x.status==="resuelto"?"Reabrir":"Marcar resuelto"}</button></div>`);
 $("#rs").onclick=async()=>{const t=$("#rp").value.trim();if(!t)return toast("Escribe la respuesta");if(await mupd(id,{reply:t,repliedAt:serverTimestamp()})){closeModal();toast("Respuesta enviada")}};
 $("#rv").onclick=async()=>{if(await mupd(id,{status:x.status==="resuelto"?"leido":"resuelto"}))closeModal()}}
onAuthStateChanged(auth,async u=>{
 if(!u)return login();
 if((u.email||"").toLowerCase()!==ADMIN){$("#app").innerHTML=`<div class="ctr"><h1>Acceso no permitido</h1><p class="mt">${esc(u.email)}</p><div class="ac" style="justify-content:center"><button class="btn g" id="so2">Cambiar de cuenta</button></div></div>`;return $("#so2").onclick=()=>signOut(auth)}
 $("#app").innerHTML='<p class="mt" style="padding:20px">Cargando…</p>';
 try{await load();render()}catch(e){$("#app").innerHTML=`<div class="ctr"><h1>No se pudo cargar</h1><p class="mt">${esc(e.code||e.message)}</p><p class="mt">¿Publicaste las reglas de Firestore?</p></div>`}});
</script></body></html>
