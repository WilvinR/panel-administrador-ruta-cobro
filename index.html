function payModal(id,k){const u=U.find(x=>x.id===id),list=k==="m"?(+C.priceMonthly||500):(+C.priceYearly||4800),pr=price(u,k);
 openModal(`<h2>Confirmar pago</h2><p class="mt">${esc(u.name)} · ${esc(u.code)} · plan ${k==="m"?"mensual":"anual"}</p><label>Monto recibido (RD$)</label><input id="am" type="number" inputmode="decimal" value="${pr}"><label>Nota (opcional)</label><input id="nt"><div class="ac"><button class="btn g" data-close>Cancelar</button><button class="btn" id="ok">Confirmar y activar</button></div>`);
 $("#ok").onclick=async()=>{const amt=+$("#am").value,note=$("#nt").value.trim();if(!(amt>=0)||$("#am").value==="")return toast("Monto inválido");$("#ok").disabled=true;
  try{const n=Date.now(),until=Math.max(n,u.paidUntil||0,u.createdAt+15*D)+(k==="m"?30:365)*D;
   const no=await runTransaction(fs,async tx=>{const cr=doc(fs,"config","app"),c=await tx.get(cr),r=(c.exists()&&c.data().nextReceipt)||1;
    tx.set(cr,{nextReceipt:r+1},{merge:true});tx.update(doc(fs,"users",id),{paidUntil:new Date(until),blocked:false});tx.delete(doc(fs,"pendientes",id));
    tx.set(doc(collection(fs,"pagos")),{uid:id,code:u.code,name:u.name,email:u.email,plan:k,price:list,amount:amt,note,receipt:r,until:new Date(until),date:serverTimestamp()});return r});
   await load();render();receipt(k,list,amt,until,no)}catch(e){toast("Error: "+(e.code||e.message));$("#ok").disabled=false}}}
function receipt(k,list,amt,until,no){const dis=list-amt,txt=`✅ Pago confirmado\nMembresía RutaCobro · plan ${k==="m"?"mensual":"anual"}\nPrecio: ${rd(list)}\n${dis>0?"Descuento: "+rd(dis)+"\n":""}Total pagado: ${rd(amt)}\nVálido hasta: ${fd(until)}\nRecibo #${String(no).padStart(4,"0")}`;
 openModal(`<h2>Pago registrado</h2><pre class="rc">${esc(txt)}</pre><div class="ac"><button class="btn g" id="cp">Copiar</button><a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(txt)}">Enviar por WhatsApp</a><button class="btn g" data-close>Cerrar</button></div>`);
 $("#cp").onclick=()=>navigator.clipboard.writeText(txt).then(()=>toast("Copiado"))}
function exModal(id){const u=U.find(x=>x.id===id);
 openModal(`<h2>Exonerar a ${esc(u.name)}</h2><label>Hasta (vacío = permanente)</label><input id="eu" type="date"><label>Motivo</label><input id="em" value="${esc(u.exemptNote||"")}"><div class="ac"><button class="btn g" data-close>Cancelar</button><button class="btn g" id="eq">Quitar exoneración</button><button class="btn" id="eg">Exonerar</button></div>`);
 $("#eg").onclick=()=>{const v=$("#eu").value,nt=$("#em").value.trim();upd(id,v?{exempt:false,exemptUntil:new Date(v+"T23:59:59"),exemptNote:nt}:{exempt:true,exemptUntil:null,exemptNote:nt})};
 $("#eq").onclick=()=>upd(id,{exempt:false,exemptUntil:null})}
function dsModal(id){const u=U.find(x=>x.id===id);
 openModal(`<h2>Descuento para ${esc(u.name)}</h2><label>Tipo</label><select id="dt"><option value="">Sin descuento</option><option value="pct" ${u.discType==="pct"?"selected":""}>Porcentaje (%)</option><option value="fix" ${u.discType==="fix"?"selected":""}>Precio mensual fijo (RD$)</option></select><label>Valor</label><input id="dv" type="number" inputmode="decimal" value="${u.discValue||""}"><div class="ac"><button class="btn g" data-close>Cancelar</button><button class="btn" id="dg">Guardar</button></div>`);
 $("#dg").onclick=()=>{const t=$("#dt").value,v=+$("#dv").value;if(t&&!(v>0))return toast("Pon un valor");if(t==="pct"&&v>100)return toast("Máximo 100%");upd(id,t?{discType:t,discValue:v}:{discType:null,discValue:0})}}
const SL={nuevo:["Nuevo","er"],leido:["Leído","wn"],resuelto:["Resuelto","ok"]};
function vM(){return M.map(m=>`<div class="it" data-m="${m.id}"><div class="grow"><div class="nm">${esc(m.name)} <span class="mt">${esc(m.code)}</span></div><div class="mt">${esc(String(m.text).slice(0,90))}${m.text.length>90?"…":""}</div><div class="mt">${fd(m.createdAt)}${m.reply?" · respondido":""}</div></div><span class="tg ${(SL[m.status]||SL.nuevo)[1]}">${(SL[m.status]||SL.nuevo)[0]}</span></div>`).join("")||'<p class="mt">No hay mensajes</p>'}
async function mupd(id,data,msg){try{await updateDoc(doc(fs,"mensajes",id),data);await load();render();return true}catch(e){toast("Error: "+(e.code||e.message));return false}}
async function msgModal(id){const m=M.find(x=>x.id===id);if(!m)return;
 if(m.status==="nuevo"){await mupd(id,{status:"leido"});}
 const x=M.find(y=>y.id===id);
 openModal(`<h2>${esc(x.name)}</h2><p class="mt">${esc(x.code)} · ${esc(x.email)} · ${fd(x.createdAt)}</p><div class="rc">${esc(x.text)}</div><label style="margin-top:10px;display:block">Tu respuesta (la ve en su app)</label><textarea id="rp">${esc(x.reply||"")}</textarea><div class="ac"><button class="btn g" data-close>Cerrar</button><button class="btn" id="rs">Enviar respuesta</button><button class="btn g" id="rv">${x.status==="resuelto"?"Reabrir":"Marcar resuelto"}</button></div>`);
 $("#rs").onclick=async()=>{const t=$("#rp").value.trim();if(!t)return toast("Escribe la respuesta");if(await mupd(id,{reply:t,repliedAt:serverTimestamp()})){closeModal();toast("Respuesta enviada")}};
 $("#rv").onclick=async()=>{if(await mupd(id,{status:x.status==="resuelto"?"leido":"resuelto"}))closeModal()}}
onAuthStateChanged(auth,async u=>{
 if(!u)return login();
 if((u.email||"").toLowerCase()!==ADMIN){$("#app").innerHTML=`<div class="ctr"><h1>Acceso no permitido</h1><p class="mt">${esc(u.email)}</p><div class="ac" style="justify-content:center"><button class="btn g" id="so2">Cambiar de cuenta</button></div></div>`;return $("#so2").onclick=()=>signOut(auth)}
 $("#app").innerHTML='<p class="mt" style="padding:20px">Cargando…</p>';
 try{await load();render()}catch(e){$("#app").innerHTML=`<div class="ctr"><h1>No se pudo cargar</h1><p class="mt">${esc(e.code||e.message)}</p><p class="mt">¿Publicaste las reglas de Firestore?</p></div>`}});
</script></body></html>
